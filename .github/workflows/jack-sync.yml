name: Sync upstream stable release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: jack-upstream-sync
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write
jobs:
  prepare:
    if: >-
      github.repository == 'jacklee-code/Sub2API-Jack' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == 'jacklee-code' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.sync.outputs.ready }}
      sha: ${{ steps.sync.outputs.sha }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # Toolchains for policy-approved regeneration from merged inputs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/jack/sync-upstream.py
      # Fail every blocked run, including existing non-draft PRs awaiting repair.
      - if: steps.sync.outputs.blocked == 'true'
        env:
          PR: ${{ steps.sync.outputs.pr }}
          REASON: ${{ steps.sync.outputs.reason }}
        run: |
          echo "### Upstream sync blocked: $PR" >> "$GITHUB_STEP_SUMMARY"
          echo 'Repair it as described in CONTRIBUTING.md (upstream sync).' >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync PR $PR is blocked ($REASON); repair and verify it, then merge with a merge commit."
          exit 1
  verify:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/jack-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  promote:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: jack-inherited-*
          merge-multiple: true
          path: inherited
      - name: Note inherited upstream test failures
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          shopt -s nullglob; files=(inherited/*.txt)
          (( ${#files[@]} )) || exit 0
          { echo 'Tests that also fail on the official release (inherited, not Jack regressions):'; echo
            sort "${files[@]}" | sed 's/.*/- `&`/'; } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: gh pr merge "$PR" --merge --match-head-commit "$SHA"
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run jack-main.yml --repo "$REPO" --ref main
