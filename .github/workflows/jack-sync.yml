name: Sync upstream stable release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: jack-upstream-sync
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write
jobs:
  prepare:
    if: >-
      github.repository == 'jacklee-code/Sub2API-Jack' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == 'jacklee-code' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.sync.outputs.ready }}
      sha: ${{ steps.sync.outputs.sha }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # Regenerates frontend/pnpm-lock.yaml when it is the only conflict.
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/jack/sync-upstream.py
      # A green run must mean nothing is waiting: fail once when a new sync PR is
      # blocked (GitHub notifies the owner) and warn while it stays unrepaired.
      - if: steps.sync.outputs.blocked == 'true'
        env:
          PR: ${{ steps.sync.outputs.pr }}
          REASON: ${{ steps.sync.outputs.reason }}
        run: |
          echo "### Upstream sync blocked: $PR" >> "$GITHUB_STEP_SUMMARY"
          echo 'Repair it as described in CONTRIBUTING.md (上游同步).' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REASON" == existing_pr ]]; then
            echo "::warning::Upstream sync PR $PR is still a blocked draft"
          else
            echo "::error::Upstream sync PR $PR needs manual conflict repair"; exit 1
          fi
  verify:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/jack-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  promote:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: gh pr merge "$PR" --merge --match-head-commit "$SHA"
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run jack-main.yml --repo "$REPO" --ref main
