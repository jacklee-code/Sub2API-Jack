name: Publish Jack
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: jack-publish
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/jack-checks.yml
    with:
      ref: ${{ github.sha }}
  publish:
    needs: verify
    if: >-
      github.repository == 'jacklee-code/Sub2API-Jack' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == 'jacklee-code' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Avoid publishing the same commit twice
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(git tag --points-at HEAD --list 'v*-jack.*')
          tag=$(printf '%s\n' "$tags" | sort -V | tail -1)
          if [[ -n "$tag" ]] && gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            echo "resume_version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          version: 9
      - uses: actions/setup-node@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.existing.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: frontend
      - name: Build release archives
        if: steps.existing.outputs.skip != 'true'
        id: build
        env:
          RESUME_VERSION: ${{ steps.existing.outputs.resume_version }}
        run: |
          version=${RESUME_VERSION:-$(python3 scripts/jack/release.py next-version)}
          runtime=$(python3 scripts/jack/release.py runtime-id)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p .jack-dist
          for arch in amd64 arm64; do
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags=embed -trimpath -ldflags="-s -w -X main.Version=$version -X main.BuildType=release -X main.Commit=$GITHUB_SHA -X main.Date=$built -X github.com/Wei-Shaw/sub2api/internal/service.JackRuntimeID=$runtime" -o "../.jack-dist/sub2api-$arch" ./cmd/server)
            python3 scripts/jack/release.py package --version "$version" --arch "$arch" --binary ".jack-dist/sub2api-$arch"
          done
          python3 scripts/jack/release.py checksums
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.skip != 'true'
      - uses: docker/login-action@v3
        if: steps.existing.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish images and immutable release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          image=ghcr.io/jacklee-code/sub2api-jack
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image:$VERSION-$arch" --push ".jack-build/$arch"
          done
          docker buildx imagetools create --tag "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1 || git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          python3 - <<'PY'
          import json, os
          m=json.load(open('.jack-dist/jack-release.json'))
          with open('.jack-dist/notes.md','w') as f:
              f.write(f"Sub2API-Jack {m['version']}\n\nBased on official {m['upstream_version']} ({m['upstream_commit']}).\n\nFleet management and Jack regression checks passed. Production deployment remains manual.\n\nDocker: `ghcr.io/jacklee-code/sub2api-jack:{m['version']}`\n\nRuntime ID: `{m['runtime_id']}`. Binary rollback is limited to compatible Jack releases on the same upstream base.\n")
          PY
          gh release create "v$VERSION" .jack-dist/sub2api_*.tar.gz .jack-dist/checksums.txt .jack-dist/jack-release.json --title "Sub2API-Jack $VERSION" --notes-file .jack-dist/notes.md --latest --verify-tag
